# The RAG (homework 2). `make rag` ingests data/rag/raw/, measures retrieval and answers the
# test set (evals/); CI runs the same and fails below `thresholds`.

models:
  embeddings: baai/bge-m3                                # OpenRouter, $0.01 per 1M tokens
  reranker: BAAI/bge-reranker-v2-m3-int8                 # local cross-encoder (fastembed, CPU)
  answer: mistralai/mistral-small-3.2-24b-instruct       # $0.075 in / $0.20 out per 1M tokens
  judge: anthropic/claude-haiku-5.5                      # $0.10 in / $0.50 out per 1M tokens

prompts:            # prompts/rag/<name>_<version>.yaml; see prompts/CHANGELOG.md
  answer: v1
  judge: v1
  faithfulness: v1

search:
  mode: rerank      # bm25, vector, hybrid or rerank
  candidates: 30    # taken from BM25 and from the vectors each
  rerank_top: 20    # fused candidates the cross-encoder scores
  rrf_k: 60
  k: 6              # passages the answer may use

answer:
  context_tokens: 1800   # the passages' budget in the prompt
  min_relevance: 0.2     # best passage scored below this by the reranker: "not in the documents"

# CI fails when a metric of the run falls below its threshold.
thresholds:
  recall_at_5: 0.80        # retrieval questions, the mode above
  source_accuracy: 0.75    # answerable questions whose answer cites a right source
  abstention: 0.85         # unanswerable questions answered "not in the documents"
  key_facts: 0.65          # expected facts found in the answers
  judge_correct: 0.65      # the calibrated judge's "correct"
  faithfulness: 0.80       # claims supported by the passages
  judge_agreement: 0.70    # the judge agrees with the hand grades
